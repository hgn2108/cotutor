name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -t cotutor-api backend
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 7860:7860 cotutor-api
          for i in $(seq 1 30); do curl -sf localhost:7860/api/health && break; sleep 1; done
          curl -sf localhost:7860/api/problems | python3 -c "import json,sys; assert len(json.load(sys.stdin)) == 12"
          docker logs api
